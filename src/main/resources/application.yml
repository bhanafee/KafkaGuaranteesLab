server:
  # The /lab endpoints are unprotected and two of their faults stop the JVM, so the application
  # listens on this machine only. Set server.address=0.0.0.0 to open it to the network.
  address: localhost

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kafka-guarantees-lab-group

# The lab's own settings. They are not Spring Boot properties.
lab:
  topics:
    # Partitions of the language-preferences and dead-letters topics, which the application creates
    # at start if they are missing. It adds partitions to a topic that has fewer. Three, so that
    # ordering per key across partitions can be observed and two instances can share the topic.
    partitions: 3
  producer:
    # Kafka's idempotent producer. The stage1 profile turns it off.
    idempotence: true
    # Kafka's delivery.timeout.ms: how long one send() goes on trying before its future fails.
    # 120000 is Kafka's default. Kafka rejects a value below linger.ms + request.timeout.ms, which
    # is 30005 with the defaults the lab leaves in place.
    delivery-timeout-ms: 120000
  publish:
    # How long POST /language-preferences waits for the publish outcome before answering 503.
    response-timeout-ms: 10000
  consumer:
    redelivery:
      # DefaultErrorHandler: wait between redeliveries, and redeliveries after the first delivery.
      interval-ms: 1000
      max-attempts: 2
    # What happens to an event whose processing failed on every attempt.
    # acknowledge: log it and acknowledge the record unprocessed.
    # rethrow: fail the delivery, so the record is redelivered and finally dead-lettered.
    fallback: acknowledge
    # Skip an event whose id was already processed.
    deduplicate: false
  dead-letter:
    topic: dead-letters
    send-timeout-ms: 10000
  ledger:
    # The topic that holds the ledger, so that it survives a restart and is shared by instances.
    topic: lab-ledger
    # How long to wait for the replay at start, and for each entry to be written and read back.
    timeout-ms: 10000
  circuit-breakers:
    # The stage1 and stage2 profiles turn the circuit breakers off.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      languagePreferenceProducer:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      languagePreferenceConsumer:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10

  retry:
    instances:
      languagePreferenceProducer:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.lang.Exception
        # An open circuit rejects every attempt, so retrying only delays the failure.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      languagePreferenceConsumer:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.lang.Exception
        # As for the producer. The fallback still runs for a rejected call, at once.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
