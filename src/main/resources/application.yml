spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kafka-guarantees-lab-group

# The lab's own settings. They are not Spring Boot properties.
lab:
  producer:
    # Kafka's idempotent producer. The stage1 profile turns it off.
    idempotence: true
  publish:
    # How long POST /language-preferences waits for the publish outcome before answering 503.
    response-timeout-ms: 10000
  consumer:
    redelivery:
      # DefaultErrorHandler: wait between redeliveries, and redeliveries after the first delivery.
      interval-ms: 1000
      max-attempts: 2
    # What happens to an event whose processing failed on every attempt.
    # acknowledge: log it and acknowledge the record unprocessed.
    # rethrow: fail the delivery, so the record is redelivered and finally dead-lettered.
    fallback: acknowledge
    # Skip an event whose id was already processed.
    deduplicate: false
  dead-letter:
    topic: dead-letters
    send-timeout-ms: 10000
  circuit-breakers:
    # The stage1 and stage2 profiles turn the circuit breakers off.
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      languagePreferenceProducer:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      languagePreferenceConsumer:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10

  retry:
    instances:
      languagePreferenceProducer:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.lang.Exception
        # An open circuit rejects every attempt, so retrying only delays the failure.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      languagePreferenceConsumer:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.lang.Exception
