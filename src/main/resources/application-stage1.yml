# Stage 1 of the lab: Kafka idempotence off, Resilience4j off.
# Run with: ./gradlew bootRun --args='--spring.profiles.active=stage1'
lab:
  producer:
    idempotence: false
  consumer:
    # Without a retry to exhaust, a failed delivery goes straight to redelivery and dead-lettering.
    fallback: rethrow
  circuit-breakers:
    enabled: false

resilience4j:
  retry:
    instances:
      # One attempt means no retry.
      languagePreferenceProducer:
        max-attempts: 1
      languagePreferenceConsumer:
        max-attempts: 1
