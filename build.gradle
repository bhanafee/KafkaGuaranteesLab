buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dep.mgmt)
    alias(libs.plugins.spotless)
    alias(libs.plugins.owasp.dependencycheck)
}

group = 'com.maybeitssquid'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.release.get().toInteger()
}

repositories {
    mavenCentral()
}

// Dynamic version ranges otherwise resolve to prereleases; slf4j "2.+" picks up 2.1.0-alpha1.
// Match known prerelease qualifiers rather than allowlisting stable ones. Stable releases carry
// odd suffixes — 0.0.20131108.vaadin1 and 2.3.1-b170201.1204 are both stable — and an allowlist
// rejects them, breaking resolution of transitive dependencies.
configurations.all {
    resolutionStrategy.componentSelection.all { selection ->
        if (selection.candidate.version ==~ /(?i).*[.\-](alpha|beta|rc|cr|snapshot|preview|dev|milestone|m\d+)[.\-]?\d*$/) {
            selection.reject('prerelease version')
        }
    }
}

dependencies {
    constraints {
        libs.bundles.security.patches.get().each {
            add('implementation', it)
        }
    }
    implementation libs.spring.boot.web
    implementation libs.spring.boot.actuator
    implementation libs.spring.boot.aspectj
    implementation libs.spring.kafka
    implementation libs.resilience4j.spring.boot
    implementation libs.micrometer.prometheus

    testImplementation libs.spring.boot.test
    testImplementation libs.spring.kafka.test
    testImplementation libs.resilience4j.test
}

dependencyManagement {
    // Override BOM-managed versions for security patches (versions from catalog)
    dependencies {
        dependency "org.apache.httpcomponents.core5:httpcore5-h2:${libs.versions.httpcore5H2.get()}"
        dependency "org.apache.httpcomponents.core5:httpcore5:${libs.versions.httpcore5Core.get()}"
        dependency "org.apache.httpcomponents.client5:httpclient5:${libs.versions.httpclient5.get()}"
        dependency "org.apache.logging.log4j:log4j-api:${libs.versions.log4jApi.get()}"
        dependency "org.apache.logging.log4j:log4j-to-slf4j:${libs.versions.log4jApi.get()}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    java {
        targetExclude 'src/*/java/module-info.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencyCheck {
    failBuildOnCVSS = 7
}
