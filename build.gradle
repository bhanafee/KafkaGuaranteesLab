buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'jvm-test-suite'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
    alias(libs.plugins.owasp.dependencycheck)
}

group = 'com.maybeitssquid'
version = '0.0.1-SNAPSHOT'

// shared:begin java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
    withJavadocJar()
}
// shared:end java

// shared:begin release-option
tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.release.get().toInteger()
}
// shared:end release-option

repositories {
    mavenCentral()
}

// Dynamic version ranges otherwise resolve to prereleases; slf4j "2.+" picks up 2.1.0-alpha1.
// Match known prerelease qualifiers rather than allowlisting stable ones. Stable releases carry
// odd suffixes — 0.0.20131108.vaadin1 and 2.3.1-b170201.1204 are both stable — and an allowlist
// rejects them, breaking resolution of transitive dependencies.
// shared:begin prerelease-filter
configurations.all {
    resolutionStrategy.componentSelection.all { selection ->
        if (selection.candidate.version ==~ /(?i).*[.\-](alpha|beta|rc|cr|snapshot|preview|dev|milestone|m\d+)[.\-]?\d*$/) {
            selection.reject('prerelease version')
        }
    }
}
// shared:end prerelease-filter

dependencies {
    constraints {
        libs.bundles.security.patches.get().each {
            add('implementation', it)
        }
    }
    implementation libs.bundles.spring.boot.core
    implementation libs.spring.kafka
    implementation libs.resilience4j.spring.boot
    implementation libs.micrometer.prometheus
}

// Spring Boot's BOM wins over the catalog's security-patch constraints for the modules it manages,
// so those modules also need a dependencyManagement override. The versions come from the patch
// entries in the catalog, so each patched version is declared only once.
def patchVersion = { String module ->
    def patch = libs.bundles.security.patches.get().find { it.module.toString() == module }
    if (patch == null) {
        throw new GradleException("No security-patches entry for ${module}")
    }
    patch.versionConstraint.preferredVersion
}

dependencyManagement {
    // Jackson BOMs import after Spring Boot's, so they override its Jackson versions and keep
    // every module aligned. Jackson 2 last so its jackson-annotations wins over Jackson 3's.
    imports {
        mavenBom "tools.jackson:jackson-bom:${patchVersion('tools.jackson.core:jackson-databind')}"
        mavenBom "com.fasterxml.jackson:jackson-bom:${patchVersion('com.fasterxml.jackson.core:jackson-databind')}"
    }

    dependencies {
        [
            'org.apache.tomcat.embed:tomcat-embed-core',
            'org.apache.tomcat.embed:tomcat-embed-el',
            'org.apache.tomcat.embed:tomcat-embed-websocket',
            'org.apache.httpcomponents.core5:httpcore5-h2',
            'org.apache.httpcomponents.core5:httpcore5',
            'org.apache.httpcomponents.client5:httpclient5',
            'org.apache.logging.log4j:log4j-api',
            'org.apache.logging.log4j:log4j-to-slf4j',
            'at.yawk.lz4:lz4-java',
        ].each { module ->
            dependency "${module}:${patchVersion(module)}"
        }
    }
}

testing {
    suites.test {
        // The version comes from the Spring Boot BOM. Without one, useJUnitJupiter() declares Gradle's
        // default, and the dependency-management plugin lets a declared version win over the BOM. Read
        // lazily, so BOMs imported later in the build (such as a subproject's Spring Cloud BOM) count.
        useJUnitJupiter(provider { dependencyManagement.importedProperties['junit-jupiter.version'] })
        dependencies {
            implementation libs.spring.boot.starter.test
            implementation libs.spring.kafka.test
            implementation libs.resilience4j.test
            runtimeOnly libs.junit.platform.launcher
        }

        // Tests run on the JDK named by -PtestJava (CI passes each matrix version); without it, on the
        // toolchain. Compilation always uses the toolchain, targeting the release version.
        targets.configureEach {
            testTask.configure {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = providers.gradleProperty('testJava')
                            .orElse(libs.versions.java)
                            .map { JavaLanguageVersion.of(it) }
                }
                // Log the test JVM so each CI job shows which Java its tests ran on.
                doFirst { task ->
                    def jvm = task.javaLauncher.get().metadata
                    task.logger.lifecycle("Tests run on Java ${jvm.javaRuntimeVersion} (${jvm.vendor}, ${jvm.installationPath})")
                }
            }
        }
    }
}

// shared:begin jacoco-report
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = false
    }
}
// shared:end jacoco-report

// shared:begin spotless
spotless {
    java {
        targetExclude 'src/*/java/module-info.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
// shared:end spotless

// The NVD key is optional. Without one, the check uses the local NVD cache and warns.
// shared:begin nvd-key
def nvdKey = providers.environmentVariable('NVD_API_KEY')
    .orElse(providers.gradleProperty('nvd.apiKey')).orNull
// shared:end nvd-key

// shared:begin dependency-check
dependencyCheck {
    failBuildOnCVSS = 7
    if (nvdKey) {
        nvd { apiKey = nvdKey }
    } else {
        autoUpdate = false
    }
}
// shared:end dependency-check

// shared:begin nvd-warning
tasks.named('dependencyCheckAnalyze') {
    doFirst {
        if (!nvdKey) {
            logger.warn('NVD_API_KEY is not set: using the local NVD cache without a live update.')
        }
    }
}
// shared:end nvd-warning

// shared:begin javadoc-options
tasks.withType(Javadoc).configureEach {
    options {
        encoding = 'UTF-8'
        links "https://docs.oracle.com/en/java/javase/${libs.versions.java.get()}/docs/api/"
        addBooleanOption('html5', true)
        // Standard JDK documentation tags are not registered for non-JDK code by default
        tags(
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
        )
    }
}
// shared:end javadoc-options
