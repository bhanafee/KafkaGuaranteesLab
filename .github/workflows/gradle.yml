name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]

    steps:
      - uses: actions/checkout@v6
      # Gradle and the compiler run on the JDK 25 toolchain (listed last, so it is the default);
      # the tests run on the matrix JDK, passed to the build as testJava. check-latest takes the
      # newest Temurin patch from Adoptium instead of the runner image's copy, which has lagged
      # releases by days to weeks.
      - name: Set up JDK ${{ matrix.java-version }} for tests and JDK 25 for the build
        uses: actions/setup-java@v5
        with:
          java-version: |
            ${{ matrix.java-version }}
            25
          distribution: 'temurin'
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build with Gradle
        run: >-
          ./gradlew build
          -PtestJava=${{ matrix.java-version }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java-version }}_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-detect=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: '**/build/reports/tests/test/'

  line-endings:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Check wrapper script line endings
        # gradlew must be stored LF and gradlew.bat CRLF; `./gradlew wrapper` regenerates both correctly.
        run: |
          rc=0
          check() {
            actual=$(git ls-files --eol -- "$1" | awk '{print $1}')
            if [ "$actual" != "i/$2" ]; then
              echo "::error file=$1::$1 is stored with ${actual#i/} line endings, expected $2. Regenerate with ./gradlew wrapper."
              rc=1
            fi
          }
          check gradlew lf
          check gradlew.bat crlf
          exit $rc

      - name: Check files match .gitattributes
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::These files are not stored as .gitattributes requires; run 'git add --renormalize .' and commit:"
            git diff --cached --stat
            exit 1
          fi
