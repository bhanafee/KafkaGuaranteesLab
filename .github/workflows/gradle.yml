# This workflow builds and tests the Java application across multiple Java versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build and Test
        run: ./gradlew build

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: build/reports/tests/

  line-endings:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Check wrapper script line endings
        # gradlew must be stored LF and gradlew.bat CRLF; `./gradlew wrapper` regenerates both correctly.
        run: |
          rc=0
          check() {
            actual=$(git ls-files --eol -- "$1" | awk '{print $1}')
            if [ "$actual" != "i/$2" ]; then
              echo "::error file=$1::$1 is stored with ${actual#i/} line endings, expected $2. Regenerate with ./gradlew wrapper."
              rc=1
            fi
          }
          check gradlew lf
          check gradlew.bat crlf
          exit $rc

      - name: Check files match .gitattributes
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::These files are not stored as .gitattributes requires; run 'git add --renormalize .' and commit:"
            git diff --cached --stat
            exit 1
          fi
